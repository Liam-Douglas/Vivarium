name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc -b && vite build`, so this covers typecheck.
      #
      # The Supabase vars are needed, and this step used to say the opposite.
      # Vite inlines import.meta.env.VITE_* at build time, and lib/supabase.ts
      # throws at module scope when they are absent — so the bundler proved the
      # throw unconditional, dropped the whole app as unreachable, and emitted
      # 600 kB of vendor code with an exit status of 0. The build half of this
      # job was checking nothing for as long as that comment was here.
      #
      # These are placeholders, not the real project's. Nothing calls them: the
      # build only needs the module to finish initialising. The real values are
      # set in Vercel, which is why production was never affected.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-secret
      # And the assertion, so the next time this silently empties out, a check
      # goes red instead of a deploy going out.
      - run: node scripts/check-bundle.mjs

  render:
    name: Render
    runs-on: ubuntu-latest
    # Every job here carries a timeout because a job without one inherits
    # GitHub's six-hour limit, and this one spent all six: a service worker the
    # built page registers kept a browser context alive, context.close() waited
    # on it forever, and the run was killed reporting "cancelled" — which reads
    # as neither a pass nor a failure. The cause is fixed in run.mjs; this is so
    # the next unbounded wait costs minutes instead of a working day.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Its own job rather than part of Tests: this one builds the app and
      # drives a browser, so it is slower and has failure modes — a missing
      # browser, a port in use — that have nothing to do with the code. Mixed
      # into the unit suite those would read as test failures.
      #
      # No browser download: the harness looks for a Chrome that already
      # exists, and GitHub's runner images ship Google Chrome. If a future
      # image drops it, this fails with the paths it tried, and the fix is to
      # install one here rather than to add a postinstall to every job.
      - run: npm run render

  rls-test:
    name: RLS test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL for the fixture to be built in. Nothing here
    # touches the real database — the test that runs against production is run
    # by hand, and this only checks that it would still notice a hole.
    services:
      postgres:
        image: postgres:16
        env:
          # Local to the job and reachable only from it. The password exists
          # because the image requires one, not because it guards anything.
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # Setting PGHOST is what tells the script to connect over TCP rather than
      # becoming the postgres unix user, which is how it runs on a laptop.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # No npm ci: the script is bash, psql and one node script that imports
      # nothing outside node itself, and the runner image ships both the
      # PostgreSQL client and node. If a future image drops psql, the script
      # says it cannot reach the server rather than reporting a pass.
      - run: ./scripts/check-rls-test.sh

  schema-types:
    name: Schema types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only meaningful against a base: it asks what this branch changed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the base commit, which a shallow clone
          # does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm ci: the script uses only node builtins and git, so there is
      # nothing to install.
      - run: node scripts/check-types-fresh.mjs ${{ github.event.pull_request.base.sha }}
