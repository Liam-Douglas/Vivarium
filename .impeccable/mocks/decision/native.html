<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#000;color:#fff;font:17px/1.3 -apple-system,system-ui,sans-serif}
.top{padding:56px 16px 8px}.d{font-weight:700;font-size:34px;letter-spacing:.01em}.sub{color:#8E8E93;font-size:15px;margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}.c{background:#1C1C1E;border-radius:12px;padding:12px}.c .l{font-size:13px;font-weight:600}.c .v{font-size:28px;font-weight:700;margin-top:6px}
.sec{padding:18px 16px 6px;font-size:22px;font-weight:700}
.list{margin:0 16px;background:#1C1C1E;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:.5px solid #38383A}.row:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:#3A3A3C;display:flex;align-items:center;justify-content:center;font-weight:600;color:#AEAEB2}
.n{font-size:17px}.s{font-size:13px;color:#8E8E93}.chev{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{font-size:15px;font-weight:600;color:#30D158;background:rgba(48,209,88,.15);border-radius:999px;padding:6px 14px}
.tab{position:absolute;bottom:0;left:0;right:0;height:83px;background:rgba(22,22,24,.94);border-top:.5px solid #38383A;display:flex;justify-content:space-around;padding-top:8px;font-size:10px;color:#8E8E93}.on{color:#30D158}.dot{width:24px;height:24px;border-radius:6px;background:currentColor;opacity:.9;margin:0 auto 3px}
</style></head><body>
<div class="top"><div class="d">Today</div><div class="sub">Wednesday 15 October</div></div>
<div class="cards"><div class="c"><div class="l" style="color:#FF453A">Overdue</div><div class="v">2</div></div><div class="c"><div class="l" style="color:#FF9F0A">Due soon</div><div class="v">3</div></div></div>
<div class="sec">Feed today</div>
<div class="list">
<div class="row"><div class="av">N</div><div><div class="n">Nagini</div><div class="s" style="color:#FF453A">4 days overdue</div></div><div class="chev"><span class="pill">Feed</span></div></div>
<div class="row"><div class="av">M</div><div><div class="n">Mango</div><div class="s" style="color:#FF453A">1 day overdue</div></div><div class="chev"><span class="pill">Feed</span></div></div>
<div class="row"><div class="av">K</div><div><div class="n">Kobe</div><div class="s" style="color:#FF9F0A">Due today</div></div><div class="chev"><span class="pill">Feed</span></div></div>
<div class="row"><div class="av">S</div><div><div class="n">Suki</div><div class="s" style="color:#FF9F0A">Due today</div></div><div class="chev"><span class="pill">Feed</span></div></div>
</div>
<div class="tab"><div class="on"><div class="dot"></div>Today</div><div><div class="dot"></div>Animals</div><div><div class="dot"></div>Feeding</div><div><div class="dot"></div>Stats</div><div><div class="dot"></div>More</div></div>
</body></html>
