<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#111214;color:#F4F4F2;font:15px/1.35 -apple-system,system-ui,"Helvetica Neue",sans-serif}
.top{padding:58px 20px 6px}.d{font:800 34px/1 "Bricolage Grotesque";letter-spacing:-.02em}.sub{color:#A3A6AD;margin-top:6px;font-size:15px}.sub b{color:#FF6B5E;font-weight:600}
.seg{display:flex;gap:8px;padding:14px 20px 4px}.seg span{padding:7px 13px;border-radius:999px;background:#1F2126;color:#C9CBD1;font-size:13px;font-weight:600}.seg span.on{background:#B9A7FF;color:#17151F}
.h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 10px}.h b{font:700 20px "Bricolage Grotesque"}.h a{color:#B9A7FF;font-size:14px;font-weight:600}
.row{margin:0 16px 10px;background:#1A1C20;border-radius:20px;display:flex;gap:12px;padding:10px;align-items:center}
.ph{width:72px;height:72px;border-radius:14px;flex:none;position:relative;background:linear-gradient(135deg,#6b7d3a,#232619)}
.ph.b{background:linear-gradient(135deg,#8a6a3a,#2a2118)}.ph.c{background:linear-gradient(135deg,#4f6b5a,#18211c)}.ph.d{background:linear-gradient(135deg,#7a5a4a,#241a16)}
.ph i{position:absolute;inset:auto 10px 18px 10px;height:18px;border-radius:50%;background:#d9c08a;opacity:.6}
.m{flex:1;min-width:0}.n{font:700 19px/1.1 "Bricolage Grotesque";letter-spacing:-.01em}
.genes{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.g{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#2A2D33;color:#E3E4E8}.g.het{background:none;border:1px solid #4A4E57;color:#A3A6AD}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px 3px 6px;border-radius:6px}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:#111214}
.over{background:#FF6B5E;color:#2A0F0C}.due{background:#FFB547;color:#2A1A05}
.btn{flex:none;background:#B9A7FF;color:#17151F;font-weight:700;font-size:15px;border-radius:14px;padding:12px 16px}
.nav{position:absolute;left:12px;right:12px;bottom:26px;height:64px;border-radius:24px;background:rgba(32,35,40,.86);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8C9098;font-weight:600}
.nav .on{color:#B9A7FF}.dot{width:22px;height:22px;border-radius:7px;border:2px solid currentColor;margin:0 auto 4px}
</style></head><body>
<div class="top"><div class="d">Tonight</div><div class="sub"><b>2 overdue</b> · 3 due soon · 6 animals</div></div>
<div class="seg"><span class="on">Due</span><span>All animals</span><span>Racks</span></div>
<div class="h"><b>Feed now</b><a>Select</a></div>
<div class="row"><div class="ph"><i></i></div><div class="m"><div class="n">Nagini</div><div class="genes"><span class="g">Pastel</span><span class="g">Clown</span><span class="g het">het Axanthic</span></div><div class="tag over">4 days overdue</div></div><div class="btn">Feed</div></div>
<div class="row"><div class="ph c"><i></i></div><div class="m"><div class="n">Mango</div><div class="genes"><span class="g">Harlequin</span></div><div class="tag over">1 day overdue</div></div><div class="btn">Feed</div></div>
<div class="row"><div class="ph b"><i></i></div><div class="m"><div class="n">Kobe</div><div class="genes"><span class="g">Jungle</span></div><div class="tag due">Due today</div></div><div class="btn">Feed</div></div>
<div class="row"><div class="ph d"><i></i></div><div class="m"><div class="n">Suki</div><div class="genes"><span class="g">Tremper albino</span></div><div class="tag due">Due today</div></div><div class="btn">Feed</div></div>
<div class="nav"><div class="on"><div class="dot"></div>Tonight</div><div><div class="dot"></div>Animals</div><div><div class="dot"></div>Log</div><div><div class="dot"></div>Stats</div><div><div class="dot"></div>More</div></div>
</body></html>
