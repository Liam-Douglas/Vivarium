<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;background:#131313;color:#F5F3EE;font:15px/1.35 -apple-system,system-ui,sans-serif;position:relative}
.top{padding:56px 20px 12px}.d{font:900 34px/1 Overpass;letter-spacing:-.01em}.sub{color:#A9A59C;margin-top:6px}.sub b{color:#FF5A4E}
.zones{display:flex;gap:8px;padding:4px 20px 16px;overflow:hidden}.z{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;font:800 13px Overpass;color:#131313}
.plate{margin:0 16px 12px;border-radius:18px;overflow:hidden;background:#1D1D1D}
.ph{padding:9px 12px;display:flex;align-items:center;gap:8px;font:900 13px Overpass;letter-spacing:.04em;text-transform:uppercase;color:#131313}
.ic{width:20px;height:20px;border-radius:5px;background:rgba(19,19,19,.85);display:flex;align-items:center;justify-content:center;color:#F5F3EE;font:900 13px Overpass}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid #262626}.it:first-of-type{border-top:0}
.av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#6b7d3a,#232619);flex:none}.av.b{background:linear-gradient(135deg,#8a6a3a,#2a2118)}.av.c{background:linear-gradient(135deg,#4f6b5a,#18211c)}
.n{font:800 18px/1.1 Overpass}.s{font-size:12px;color:#A9A59C;margin-top:2px}.st{font:800 12px Overpass;margin-top:3px;display:flex;align-items:center;gap:5px}
.btn{margin-left:auto;background:#F5F3EE;color:#131313;font:800 14px Overpass;border-radius:12px;padding:10px 14px}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#131313;border-top:1px solid #222;display:flex;justify-content:space-around;padding-top:10px;font:700 11px Overpass;color:#77736B}.on{color:#F5F3EE}.dot{width:22px;height:22px;border-radius:6px;background:currentColor;margin:0 auto 4px}
</style></head><body>
<div class="top"><div class="d">Feed tonight</div><div class="sub"><b>2 overdue</b> · 3 due · across 3 zones</div></div>
<div class="zones"><span class="z" style="background:#E8833A">Rack A</span><span class="z" style="background:#2BA39A">Shelf 2</span><span class="z" style="background:#E8C547">Display viv</span></div>
<div class="plate"><div class="ph" style="background:#E8833A"><span class="ic">A</span>Rack A · tubs 1–6</div>
<div class="it"><div class="av"></div><div><div class="n">Nagini</div><div class="s">Ball python · Pastel Clown</div><div class="st" style="color:#FF5A4E">▲ 4 days overdue</div></div><span class="btn">Feed</span></div>
<div class="it"><div class="av b"></div><div><div class="n">Pip</div><div class="s">Children's python</div><div class="st" style="color:#F2B33D">● Due today</div></div><span class="btn">Feed</span></div></div>
<div class="plate"><div class="ph" style="background:#2BA39A"><span class="ic">S</span>Shelf 2 · geckos</div>
<div class="it"><div class="av c"></div><div><div class="n">Mango</div><div class="s">Crested gecko · Harlequin</div><div class="st" style="color:#FF5A4E">▲ 1 day overdue</div></div><span class="btn">Feed</span></div></div>
<div class="nav"><div class="on"><div class="dot"></div>Tonight</div><div><div class="dot"></div>Animals</div><div><div class="dot"></div>Log</div><div><div class="dot"></div>Stats</div><div><div class="dot"></div>More</div></div>
</body></html>
